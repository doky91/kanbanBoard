version: '3'
services:
  db:
    image: mysql:8.0.33
    container_name: mySQL-board
    ports:
      - '3306:3306'
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=board
    volumes:
      - myboard:/var/lib/mysql
    command: mysqld --default-authentication-plugin=mysql_native_password


volumes:
  myboard: