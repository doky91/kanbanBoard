# Datasource config for your MySQL 8.0 database
spring.datasource.url=jdbc:mysql://localhost:3306/board?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate (optional, uncomment if you use JPA)
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Flyway migration settings
spring.flyway.enabled=true
# Let Flyway use the datasource settings, so no need to specify url/user/password again
# spring.flyway.url=jdbc:mysql://localhost:3306/board?serverTimezone=UTC
# spring.flyway.user=root
# spring.flyway.password=root
# spring.flyway.driver-class-name=com.mysql.cj.jdbc.Driver

# Optional: to disable placeholder replacement if needed (usually not necessary)
# spring.flyway.placeholder-replacement=false
